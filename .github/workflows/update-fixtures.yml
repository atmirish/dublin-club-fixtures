name: Update fixtures

# Builds the site with this week's fixtures and publishes it to GitHub Pages.
# Settings > Pages > Source must be set to "GitHub Actions".
on:
  # Main trigger: cron-job.org starts this every 5 minutes (07:00-23:00 Irish time) with
  # mode "smart". GitHub's own hourly schedule is only a backup (it often runs late or not at all).
  # In smart mode the "check" job decides whether a full update is worth it (scripts/should-update.mjs).
  schedule:
    - cron: '7 6-23 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: full = always update; smart = only if something may have changed
        type: choice
        options: [full, smart]
        default: full
      test_alert:
        description: Send a test alert (only goes to preview devices)
        type: boolean
        default: false

# No permissions by default; the deploy job asks only for what it needs.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.full.outputs.run || steps.smart.outputs.run }}
    steps:
      # Pushes, the Run workflow button (mode "full") and test alerts always update
      - id: full
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode != 'smart' || inputs.test_alert))
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - if: steps.full.outputs.run != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.full.outputs.run != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: smart
        name: Quick check
        if: steps.full.outputs.run != 'true'
        env:
          SITE_URL: https://atmirish.github.io/dublin-club-fixtures/
        run: node scripts/should-update.mjs

  deploy:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Only one publish at a time.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions are pinned to exact commits; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build site
        run: |
          mkdir -p _site
          cp index.html app.js manifest.webmanifest OneSignalSDKWorker.js icon-192.png icon-512.png icon-night-192.png apple-touch-icon.png _site/
          # Add a version to app.js so browsers fetch the new copy after each change
          sed -i "s|src=\"app.js\"|src=\"app.js?v=${GITHUB_SHA::7}\"|" _site/index.html
          node scripts/fetch-fixtures.mjs _site/fixtures.json
      - name: Save the currently published fixtures (to spot new results)
        run: curl -fsS "https://atmirish.github.io/dublin-club-fixtures/fixtures.json?t=$(date +%s)" -o previous-fixtures.json || echo "No previous fixtures"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # Sends new BSJ results to every subscriber. Runs after the site is published, so if
      # OneSignal fails the site is still updated; the run goes red and GitHub emails you.
      - name: Send result alerts
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_APP_ID: a9b7cfcb-32ce-447b-8bfb-a65e54a73e0a
          SITE_URL: https://atmirish.github.io/dublin-club-fixtures/
          TEST_ALERT: ${{ inputs.test_alert }}
        run: node scripts/notify-results.mjs _site/fixtures.json previous-fixtures.json
