name: Update fixtures

# Builds the site with this week's fixtures and publishes it to GitHub Pages.
# Settings > Pages > Source must be set to "GitHub Actions".
on:
  schedule:
    # Target (Irish time): weekdays every two hours 11:00-23:00; weekends every hour 10:00-22:00.
    # GitHub schedules run in UTC, so this fires every hour from 09:00 to 23:00 UTC and the
    # "check" job skips the runs that don't match the current Irish time (summer or winter).
    - cron: '7 9-23 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a test alert (preview and approval; only ever goes to preview devices)
        type: boolean
        default: false

# No permissions by default; the deploy job asks only for what it needs.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.hour.outputs.run }}
    steps:
      - id: hour
        env:
          EVENT: ${{ github.event_name }}
        run: |
          h=$(TZ=Europe/Dublin date +%H); d=$(TZ=Europe/Dublin date +%u)
          echo "Irish time: day $d, hour $h"
          run=false
          if [ "$EVENT" != "schedule" ]; then run=true
          elif [ "$d" -ge 6 ]; then case "$h" in 1[0-9]|2[0-2]) run=true;; esac
          else case "$h" in 11|13|15|17|19|21|23) run=true;; esac; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Only one publish at a time. (Kept on this job so a result alert waiting
    # for approval never holds up the fixture updates.)
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      alert: ${{ steps.prepare.outputs.alert }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions are pinned to exact commits; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build site
        run: |
          mkdir -p _site
          cp index.html app.js manifest.webmanifest OneSignalSDKWorker.js icon-192.png icon-512.png icon-night-192.png apple-touch-icon.png _site/
          # Add a version to app.js so browsers fetch the new copy after each change
          sed -i "s|src=\"app.js\"|src=\"app.js?v=${GITHUB_SHA::7}\"|" _site/index.html
          node scripts/fetch-fixtures.mjs _site/fixtures.json
      - name: Save the currently published fixtures (to spot new results)
        run: curl -fsS "https://atmirish.github.io/dublin-club-fixtures/fixtures.json?t=$(date +%s)" -o previous-fixtures.json || echo "No previous fixtures"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Prepare result alert and send a preview to the approver
        id: prepare
        continue-on-error: true
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_APP_ID: a9b7cfcb-32ce-447b-8bfb-a65e54a73e0a
          SITE_URL: https://atmirish.github.io/dublin-club-fixtures/
          TEST_ALERT: ${{ inputs.test_alert }}
        run: node scripts/notify-results.mjs prepare _site/fixtures.json previous-fixtures.json

  # Waits for approval (Settings > Environments > result-alerts > Required reviewers),
  # then sends the alert to everyone. Rejected or ignored alerts are never sent.
  send-alert:
    needs: deploy
    if: needs.deploy.outputs.alert != ''
    runs-on: ubuntu-latest
    environment: result-alerts
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Send result alert to everyone
        env:
          ALERT: ${{ needs.deploy.outputs.alert }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_APP_ID: a9b7cfcb-32ce-447b-8bfb-a65e54a73e0a
          SITE_URL: https://atmirish.github.io/dublin-club-fixtures/
        run: node scripts/notify-results.mjs send
