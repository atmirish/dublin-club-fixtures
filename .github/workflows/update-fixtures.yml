name: Update fixtures

# Builds the site with this week's fixtures and publishes it to GitHub Pages.
# Settings > Pages > Source must be set to "GitHub Actions".
on:
  schedule:
    # Target: 08:00, 12:00, 16:00 and 20:00 Irish time. GitHub schedules run in UTC,
    # so this fires at both possible UTC hours and the "check" job skips the one
    # that doesn't match the current Irish time (summer or winter).
    - cron: '7 7,8,11,12,15,16,19,20 * * *'
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.hour.outputs.run }}
    steps:
      - id: hour
        run: |
          h=$(TZ=Europe/Dublin date +%H)
          echo "Irish time hour: $h"
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else case "$h" in 08|12|16|20) echo "run=true" >> "$GITHUB_OUTPUT";; *) echo "run=false" >> "$GITHUB_OUTPUT";; esac; fi

  deploy:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site
        run: |
          mkdir -p _site
          cp index.html _site/
          node scripts/fetch-fixtures.mjs _site/fixtures.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
